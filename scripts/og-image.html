<!doctype html>
<!--
  Source de src/app/opengraph-image.png, l'image des aperçus de partage (og:image et twitter:image) de toutes les
  pages (QUAL-18). Servie comme un fichier statique : aucune fonction, aucun rendu à la demande.
  Couleurs de public/icon.svg, police Geist (celle du site). Pour régénérer l'image après une modification :

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless --hide-scrollbars \
      --window-size=1200,630 --screenshot=src/app/opengraph-image.png scripts/og-image.html

  Puis vérifier le résultat (1200 × 630) et, si le texte change, src/app/opengraph-image.alt.txt.
-->
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600&display=block" />
    <style>
      html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
      body {
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 0 96px;
        background: #1d1f2a;
        color: #f7f5ef;
        font-family: Geist, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .brand { display: flex; align-items: center; gap: 36px; }
      .brand svg { width: 168px; height: 168px; }
      .name { font-size: 132px; font-weight: 600; letter-spacing: -0.035em; line-height: 1; }
      .tagline { margin: 52px 0 0; font-size: 54px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.15; }
      .tagline span { color: #e0a52d; }
      .sub { margin: 24px 0 0; font-size: 31px; color: #a9adbd; line-height: 1.3; }
    </style>
  </head>
  <body>
    <div class="brand">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <path d="M13 44A34 34 0 0 0 51 44" stroke="#E0A52D" stroke-width="5" stroke-linecap="round" fill="none" />
        <path d="M13 44 32 16 51 44" stroke="#F7F5EF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
        <path d="M32 16 43.5 46.5" stroke="#6F8BE8" stroke-width="4" stroke-linecap="round" />
        <circle cx="32" cy="16" r="3.5" fill="#6F8BE8" />
        <path d="M51 6l1.7 4.4 4.4 1.7-4.4 1.7L51 18l-1.7-4.4-4.4-1.7 4.4-1.7z" fill="#E0A52D" />
      </svg>
      <div class="name">Sextant</div>
    </div>
    <p class="tagline">La littérature scientifique, sans détour<span>.</span></p>
    <p class="sub">Articles évalués par les pairs, thèses et ouvrages universitaires.</p>
  </body>
</html>
