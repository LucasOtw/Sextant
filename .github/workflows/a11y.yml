# Banc d'accessibilité (QUAL-43) : Playwright + axe sur chaque aperçu Vercel réussi (tests/a11y.spec.ts).
# Il vise l'URL de l'aperçu plutôt qu'un serveur lancé dans la CI : aucun compte de service de production ici.
# Les pages lisent la base de production ; le banc bloque toute requête autre que GET/HEAD.
# Aperçus protégés (Deployment Protection) : secret VERCEL_AUTOMATION_BYPASS_SECRET (« Protection Bypass for
# Automation » de Vercel), envoyé en en-tête x-vercel-protection-bypass au seul site testé.
name: a11y

on: deployment_status

permissions:
  contents: read

concurrency:
  group: a11y-${{ github.event.deployment.sha }}
  cancel-in-progress: true

jobs:
  a11y:
    if: github.event.deployment_status.state == 'success' && startsWith(github.event.deployment_status.environment, 'Preview')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_URL: ${{ github.event.deployment_status.target_url }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      # Aperçu protégé sans secret de contournement (ou secret refusé) : Vercel renvoie sa page de connexion, et axe
      # testerait celle-ci au lieu du site (18 fausses violations). Le banc n'est alors pas lancé, avec un avertissement.
      - name: Aperçu accessible ?
        id: acces
        run: |
          args=()
          if [ -n "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then args=(-H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET"); fi
          res=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' "${args[@]}" "$BASE_URL/")
          if echo "$res" | grep -qE '^(401|403)|vercel\.com/sso-api'; then
            echo "::warning title=Banc a11y non lancé::Aperçu protégé par Vercel (réponse : ${res%% *}). Ajouter le secret GitHub VERCEL_AUTOMATION_BYPASS_SECRET (Vercel > Settings > Deployment Protection > Protection Bypass for Automation)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.acces.outputs.ok == 'true'
        with:
          ref: ${{ github.event.deployment.sha }}
      - uses: actions/setup-node@v7
        if: steps.acces.outputs.ok == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: steps.acces.outputs.ok == 'true'
        run: npm ci
      - if: steps.acces.outputs.ok == 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.acces.outputs.ok == 'true'
        run: npm run test:a11y
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: rapport-a11y
          path: playwright-report/
          retention-days: 7
