# Intégration continue : lint, typage, tests unitaires et build à chaque push et PR vers dev et main, puis les
# transactions Firestore sur l'émulateur (job séparé).
# Aucun secret : les tests unitaires ne touchent jamais Firestore (alias et garde-fous dans vitest.config.mts),
# les tests sur émulateur n'acceptent qu'un projet demo-… (tests/emulator/setup.ts, src/lib/firebase/admin.ts),
# et le build passe sans variable d'environnement (comptes et résumé IA désactivés, OpenAlex en anonyme).
name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # Les émulateurs de firebase-tools (≥ 14) exigent Java 21.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npm run test:emulator
